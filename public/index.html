<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA Tracker</title>
  <link rel="icon" href="/logo.ico" type="image/x-icon">
  <!-- Pre-paint theme init: avoid flash of wrong theme -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("theme");
        var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (systemDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { /* localStorage may be blocked; default stays */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Absolute asset paths so they resolve from any client route depth
       (e.g. /quiz/session/<id>); relative paths would break there. -->
  <link rel="stylesheet" href="/core/tokens.css?v=5">
  <link rel="stylesheet" href="/core/base.css?v=5">
  <link rel="stylesheet" href="/core/components.css?v=5">
  <link rel="stylesheet" href="/nav/nav.css?v=5">
  <link rel="stylesheet" href="/modals/modals.css?v=5">
  <link rel="stylesheet" href="/practical/practical.css?v=5">
  <link rel="stylesheet" href="/practical/lab-card.css?v=5">
  <link rel="stylesheet" href="/import/import.css?v=5">
  <link rel="stylesheet" href="/stats/stats.css?v=5">
  <link rel="stylesheet" href="/quiz/quiz.css?v=5">
  <link rel="stylesheet" href="/settings/settings.css?v=5">
  <!-- Chart.js MUST load before Alpine (synchronous) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/core/main.js?v=5" defer></script>
  <script src="/core/app-shell.js?v=5" defer></script>
  <script src="/practical/lab-card.js?v=5" defer></script>
  <script src="/import/import.js?v=5" defer></script>
  <script src="/stats/stats.js?v=5" defer></script>
  <script src="/quiz/quiz.js?v=5" defer></script>
  <script src="/settings/settings.js?v=5" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
</head>
<body x-data="appShell()" x-init="init()" @keydown.window="onGlobalKey($event)">

  <!--INCLUDE:nav/nav.html-->

  <!--INCLUDE:practical/practical.html-->

  <!--INCLUDE:import/import.html-->

  <!--INCLUDE:stats/stats.html-->

  <!--INCLUDE:quiz/quiz.html-->

  <!--INCLUDE:settings/settings.html-->

  <!--INCLUDE:modals/modals.html-->

</body>
</html>
