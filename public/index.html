<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA Lab Tracker</title>
  <link rel="icon" href="/logo.ico" type="image/x-icon">
  <!-- Pre-paint theme init: avoid flash of wrong theme -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("theme");
        var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (systemDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { /* localStorage may be blocked; default stays */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js MUST load before Alpine (synchronous) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Load app.js BEFORE Alpine so deferLoadingAlpine is defined in time -->
  <script src="app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
</head>
<body x-data="appShell()" x-init="init()">

  <nav class="topnav">
    <div class="topnav-inner">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">CCNA Lab Tracker</span>
      </div>
      <div class="nav-tabs">
        <button class="nav-tab" @click="page='dashboard'" :class="{active: page==='dashboard'}">Dashboard</button>
        <button class="nav-tab" @click="page='import'"    :class="{active: page==='import'}">Import</button>
        <button class="nav-tab" @click="page='stats'"     :class="{active: page==='stats'}">Analytics</button>
      </div>
      <div class="nav-utility">
        <button class="theme-toggle" @click="toggleTheme()"
                :title="`Switch to ${theme === 'light' ? 'dark' : 'light'} mode`"
                x-text="theme === 'light' ? '☾' : '☀'"></button>
        <button class="nav-reset" @click="resetAllLabs()">↻ Reset all</button>
      </div>
    </div>
  </nav>

  <!-- DASHBOARD -->
  <div class="page" x-show="page==='dashboard'">
    <div x-show="loading" class="loading"><span class="spinner"></span> Loading…</div>
    <template x-if="!loading">
      <div>
        <!-- Hero -->
        <header class="hero">
          <div class="hero-left">
            <div class="hero-stat">
              <span x-text="String(summary.done).padStart(2,'0')"></span><span class="hero-slash"> / </span><span class="hero-total" x-text="summary.total"></span>
            </div>
            <div class="hero-rule"></div>
            <div class="hero-label">Completed</div>
          </div>
          <div class="hero-right">
            <div class="hero-percent" x-text="`${summary.completion_percent}% complete`"></div>
            <div class="hero-elapsed">⏱ <span x-text="formatTotalTime(summary.total_time_spent) + ' elapsed'"></span></div>
          </div>
          <div class="progress-track"><div class="progress-fill" :style="`width:${summary.completion_percent}%`"></div></div>
        </header>

        <!-- Filter chips -->
        <div class="filter-strip">
          <div class="status-select" @keydown.escape.prevent="statusOpen = false; $refs.statusTrigger.focus()">
            <button class="status-filter" x-ref="statusTrigger"
              aria-haspopup="menu" :aria-expanded="statusOpen.toString()"
              @click="statusOpen = !statusOpen" @click.outside="statusOpen = false"
              @keydown.arrow-down.prevent="statusOpen = true; $nextTick(() => $refs.statusMenu.querySelector('.status-option')?.focus())">
              <span x-text="{ '': 'All status', done: 'Hide done', undone: 'Hide not done' }[hideStatus]"></span>
              <svg width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="status-dropdown" role="menu" x-ref="statusMenu" x-show="statusOpen" x-cloak
              @keydown.arrow-down.prevent="$event.target.nextElementSibling?.focus()"
              @keydown.arrow-up.prevent="$event.target.previousElementSibling?.focus()">
              <button class="status-option" role="menuitem" :class="{ active: hideStatus === '' }"
                @click="hideStatus = ''; statusOpen = false; $refs.statusTrigger.focus()">All status</button>
              <button class="status-option" role="menuitem" :class="{ active: hideStatus === 'done' }"
                @click="hideStatus = 'done'; statusOpen = false; $refs.statusTrigger.focus()">Hide done</button>
              <button class="status-option" role="menuitem" :class="{ active: hideStatus === 'undone' }"
                @click="hideStatus = 'undone'; statusOpen = false; $refs.statusTrigger.focus()">Hide not done</button>
            </div>
          </div>
          <button class="filter-chip"
            :class="{ active: filterCat==='', 'filter-chip--done': labs.length > 0 && labs.every(l => l.status === 'done') }"
            @click="filterCat=''">All</button>
          <template x-for="cat in categories" :key="cat">
            <button class="filter-chip"
              :class="{ active: filterCat===cat, 'filter-chip--done': categoryDone(cat) }"
              @click="filterCat=cat"
              x-text="cat"></button>
          </template>
        </div>

        <!-- Cards -->
        <div class="cards-grid">
          <template x-for="(lab, idx) in labs" :key="lab.id">
            <article x-data="labCard(lab)" x-init="init()" :class="cardClass()"
              x-show="matchesFilter(lab)"
              x-transition:enter="card-fade-enter"
              x-transition:enter-start="card-fade-enter-from"
              x-transition:enter-end="card-fade-enter-to"
              x-transition:leave="card-fade-leave"
              x-transition:leave-start="card-fade-leave-from"
              x-transition:leave-end="card-fade-leave-to">
              <!-- Col 1: identity -->
              <div class="lab-identity">
                <div class="lab-badge" x-text="String(lab.id.replace('LAB-','')).padStart(2,'0')"></div>
                <div class="lab-content">
                  <div class="lab-name" x-text="lab.name"></div>
                  <div class="lab-meta-row">
                    <span class="lab-category" x-text="lab.category"></span>
                    <span class="meta-sep" x-show="lab.difficulty" aria-hidden="true">·</span>
                    <span class="difficulty-dots" x-show="lab.difficulty"
                      :title="`Difficulty: ${lab.difficulty}/5`">
                      <span class="difficulty-dot" :class="lab.difficulty >= 1 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 2 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 3 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 4 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 5 ? 'difficulty-dot--on' : ''"></span>
                    </span>
                    <span class="meta-sep" x-show="lab.estimated_minutes" aria-hidden="true">·</span>
                    <span class="est-time" x-show="lab.estimated_minutes">
                      <span class="est-time-icon" aria-hidden="true">⏱</span>
                      <span x-text="`~${lab.estimated_minutes}m`"></span>
                    </span>
                  </div>
                </div>
              </div>
              <!-- Col 2: reset (left) + timer (right), reset only when done -->
              <div class="lab-col-timer">
                <button class="btn-card-reset" @click="resetLab()" title="Reset this lab"
                  x-show="lab.status === 'done'">↻</button>
                <div class="lab-timer" x-text="formatTime(elapsed || lab.time_spent || 0)"></div>
              </div>
              <!-- Col 3: action buttons -->
              <div class="lab-col-actions">
                <button class="btn-action"
                  :class="running ? 'btn-action--stop' : lab.status === 'done' ? 'btn-action--done' : 'btn-action--launch'"
                  :disabled="!running && !lab.file_path"
                  :title="running ? 'Stop timer' : lab.file_path ? 'Open in Packet Tracer' : 'Import this lab first'"
                  @click="running ? stopTimer() : launch()"
                  x-text="running ? '■ Stop' : lab.status === 'done' ? '✓ Done' : lab.file_path ? 'Launch →' : '— —'">
                </button>
                <button class="btn-brief"
                  @click="openBrief()"
                  title="Quick reference: summary and key commands">
                  Brief
                </button>
                <button class="btn-docs"
                  @click="openDocs()"
                  :disabled="!lab.docs_path"
                  :title="lab.docs_path ? 'Open lab documentation' : 'Docs not generated yet — run scripts/split_pdf.py'">
                  Docs ›
                </button>
              </div>
            </article>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- IMPORT PAGE -->
  <div class="page" x-show="page==='import'" x-data="importPage()" x-init="loadStatus()">
    <header class="page-header">
      <h1 class="page-title">Import.</h1>
      <p class="page-subtitle">Bring labs into the tracker</p>
    </header>

    <div class="timeline">
      <h2 class="section-head">Method 1 — Upload</h2>
      <div class="section-body">
        <div class="dropzone"
          @dragover.prevent="dragging=true"
          @dragleave.prevent="dragging=false"
          @drop.prevent="handleDrop($event)"
          :class="{dragging}">
          <p class="dropzone-primary">Drag &amp; drop <code>.pka</code> files here</p>
          <p class="dropzone-sep">— or —</p>
          <input type="file" id="fileInput" multiple accept=".pka" @change="handleFileInput($event)">
          <label for="fileInput" class="btn-primary btn-primary--ghost">Browse Files</label>
        </div>
      </div>

      <h2 class="section-head">Method 2 — Scan Folder</h2>
      <div class="section-body">
        <div class="folder-input-row">
          <input type="text" x-model="folderPath" class="folder-input"
                 placeholder="e.g. D:\CCNA Network Labs Professional\Labs">
          <button @click="scanFolder()" :disabled="scanning" class="btn-primary">
            <span x-show="!scanning">Scan</span>
            <span x-show="scanning">Scanning…</span>
          </button>
        </div>
      </div>

      <template x-if="results.length > 0">
        <div>
          <h2 class="section-head" x-text="`Results — ${importedCount} of ${results.length} imported`"></h2>
          <div class="section-body">
            <div class="result-list">
              <template x-for="r in results" :key="r.file">
                <div class="result-row" :class="`result--${r.status}`">
                  <span class="result-glyph" x-text="r.status==='imported'?'✓':r.status==='skipped'?'!':'×'"></span>
                  <span class="result-file" x-text="r.file"></span>
                  <span class="result-detail" x-text="r.lab_id ?? r.reason"></span>
                </div>
              </template>
              <button @click="window.dispatchEvent(new CustomEvent('refresh-labs')); page='dashboard'" class="btn-primary" style="margin-top:16px">
                Go to Dashboard
              </button>
            </div>
          </div>
        </div>
      </template>

      <h2 class="section-head" x-text="`Status — ${status.imported_count} of ${status.total} imported`"></h2>
      <div class="section-body">
        <template x-if="status.missing.length === 0">
          <p class="empty-state">All labs imported. Nothing missing.</p>
        </template>
        <div class="missing-list">
          <template x-for="lab in status.missing" :key="lab.id">
            <div class="missing-row">
              <span class="missing-id" x-text="lab.id"></span>
              <span class="missing-cat" x-text="lab.category"></span>
              <span class="missing-name" x-text="lab.name"></span>
              <span class="status-pill status-pill--missing">
                <span class="status-dot"></span>Missing
              </span>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- ANALYTICS PAGE -->
  <div class="page" x-show="page==='stats'" x-data="statsPage()" x-init="load()">
    <header class="page-header">
      <h1 class="page-title">Analytics.</h1>
      <p class="page-subtitle">A study journal in numbers</p>
    </header>

    <div x-show="loading" class="loading"><span class="spinner"></span> Loading…</div>
    <template x-if="!loading">
      <div class="timeline">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num" x-text="summary.done"></div>
            <div class="stat-rule"></div>
            <div class="stat-label">Done</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" x-text="summary.in_progress"></div>
            <div class="stat-rule"></div>
            <div class="stat-label">In Progress</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" x-text="summary.not_started"></div>
            <div class="stat-rule"></div>
            <div class="stat-label">Not Started</div>
          </div>
          <div class="stat-card">
            <div class="stat-num stat-num--time" x-html="formatTimeRich(summary.total_time_spent)"></div>
            <div class="stat-rule"></div>
            <div class="stat-label">Total Time</div>
          </div>
        </div>

        <h2 class="section-head">Time per Lab — slowest first</h2>
        <div class="section-body">
          <canvas id="timeChart" height="80"></canvas>
        </div>

        <h2 class="section-head">Progress by Category</h2>
        <div class="section-body">
          <div class="category-bars">
            <template x-for="cat in byCategory" :key="cat.category">
              <div class="cat-row">
                <span class="cat-name" x-text="cat.category"></span>
                <div class="cat-track">
                  <div class="cat-fill" :style="`width:${cat.total>0?(cat.done/cat.total)*100:0}%`"></div>
                </div>
                <span class="cat-count" x-text="`${cat.done} / ${cat.total}`"></span>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Confirm Modal -->
  <div class="modal-backdrop" x-show="$store.modal.open" x-cloak
    @click="$store.modal.cancel()"
    @keydown.escape.window="$store.modal.cancel()">
    <div class="modal" @click.stop>
      <div class="modal-title" x-show="$store.modal.title" x-text="$store.modal.title"></div>
      <p class="modal-message" x-text="$store.modal.message"></p>
      <div class="modal-actions">
        <button class="modal-btn modal-btn--cancel" @click="$store.modal.cancel()">Cancel</button>
        <button class="modal-btn modal-btn--ok" :class="{ 'modal-btn--danger': $store.modal.danger }"
          @click="$store.modal.ok()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Summary (Brief) Modal -->
  <div class="modal-backdrop" x-show="$store.summaryModal.open" x-cloak
    @click="$store.summaryModal.close()"
    @keydown.escape.window="$store.summaryModal.close()">
    <div class="modal summary-modal" @click.stop>
      <div class="modal-title">
        <span x-text="$store.summaryModal.lab?.id"></span>
        ·
        <span x-text="$store.summaryModal.lab?.name"></span>
      </div>

      <template x-if="$store.summaryModal.loading">
        <p class="modal-message">Loading…</p>
      </template>
      <template x-if="$store.summaryModal.error">
        <p class="modal-message" x-text="$store.summaryModal.error"></p>
      </template>

      <template x-if="$store.summaryModal.data">
        <div class="summary-body">
          <template x-if="$store.summaryModal.data.summary">
            <section>
              <h4>Summary</h4>
              <p x-text="$store.summaryModal.data.summary"></p>
            </section>
          </template>

          <template x-if="$store.summaryModal.data.core_commands?.length">
            <section>
              <h4>Core commands</h4>
              <ul class="cmd-list">
                <template x-for="c in $store.summaryModal.data.core_commands" :key="c.cmd">
                  <li><code x-text="c.cmd"></code><span class="cmd-note" x-text="c.note"></span></li>
                </template>
              </ul>
            </section>
          </template>

          <template x-if="$store.summaryModal.data.verify_commands?.length">
            <section>
              <h4>Verify / show</h4>
              <ul class="cmd-list">
                <template x-for="c in $store.summaryModal.data.verify_commands" :key="c.cmd">
                  <li><code x-text="c.cmd"></code><span class="cmd-note" x-text="c.note"></span></li>
                </template>
              </ul>
            </section>
          </template>

          <template x-if="$store.summaryModal.data.gotchas?.length">
            <section>
              <h4>Watch out for</h4>
              <ul class="gotcha-list">
                <template x-for="g in $store.summaryModal.data.gotchas" :key="g">
                  <li x-text="g"></li>
                </template>
              </ul>
            </section>
          </template>
        </div>
      </template>

      <div class="modal-actions">
        <button class="modal-btn modal-btn--cancel" @click="$store.summaryModal.close()">Close</button>
      </div>
    </div>
  </div>

</body>
</html>
