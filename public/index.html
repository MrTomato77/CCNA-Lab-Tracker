<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA Lab Tracker</title>
  <link rel="icon" href="/logo.ico" type="image/x-icon">
  <!-- Pre-paint theme init: avoid flash of wrong theme -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("theme");
        var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (systemDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { /* localStorage may be blocked; default stays */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="core/tokens.css">
  <link rel="stylesheet" href="core/base.css">
  <link rel="stylesheet" href="core/components.css">
  <link rel="stylesheet" href="nav/nav.css">
  <link rel="stylesheet" href="modals/modals.css">
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js MUST load before Alpine (synchronous) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="core/main.js" defer></script>
  <script src="core/app-shell.js" defer></script>
  <script src="app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
</head>
<body x-data="appShell()" x-init="init()">

  <!--INCLUDE:nav/nav.html-->

  <!-- DASHBOARD -->
  <div class="page" x-show="page==='dashboard'">
    <div x-show="loading" class="loading"><span class="spinner"></span> Loading…</div>
    <template x-if="!loading">
      <div>
        <!-- Hero -->
        <header class="hero">
          <div class="hero-left">
            <div class="hero-stat">
              <span x-text="String(summary.done).padStart(2,'0')"></span><span class="hero-slash"> / </span><span class="hero-total" x-text="summary.total"></span>
            </div>
            <div class="hero-rule"></div>
            <div class="hero-label">Completed</div>
          </div>
          <div class="hero-right">
            <div class="hero-percent" x-text="`${summary.completion_percent}% complete`"></div>
            <div class="hero-elapsed">⏱ <span x-text="formatTotalTime(summary.total_time_spent) + ' elapsed'"></span></div>
          </div>
          <div class="progress-track"><div class="progress-fill" :style="`width:${summary.completion_percent}%`"></div></div>
        </header>

        <!-- Filter chips -->
        <div class="filter-strip">
          <div class="status-select" @keydown.escape.prevent="statusOpen = false; $refs.statusTrigger.focus()">
            <button class="status-filter" x-ref="statusTrigger"
              aria-haspopup="menu" :aria-expanded="statusOpen.toString()"
              @click="statusOpen = !statusOpen" @click.outside="statusOpen = false"
              @keydown.arrow-down.prevent="statusOpen = true; $nextTick(() => $refs.statusMenu.querySelector('.status-option')?.focus())">
              <span x-text="{ '': 'All status', done: 'Hide done', undone: 'Hide not done' }[hideStatus]"></span>
              <svg width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="status-dropdown" role="menu" x-ref="statusMenu" x-show="statusOpen" x-cloak
              @keydown.arrow-down.prevent="$event.target.nextElementSibling?.focus()"
              @keydown.arrow-up.prevent="$event.target.previousElementSibling?.focus()">
              <button class="status-option" role="menuitem" :class="{ active: hideStatus === '' }"
                @click="setFilter(() => hideStatus = ''); statusOpen = false; $refs.statusTrigger.focus()">All status</button>
              <button class="status-option" role="menuitem" :class="{ active: hideStatus === 'done' }"
                @click="setFilter(() => hideStatus = 'done'); statusOpen = false; $refs.statusTrigger.focus()">Hide done</button>
              <button class="status-option" role="menuitem" :class="{ active: hideStatus === 'undone' }"
                @click="setFilter(() => hideStatus = 'undone'); statusOpen = false; $refs.statusTrigger.focus()">Hide not done</button>
            </div>
          </div>
          <button class="filter-chip"
            :class="{ active: filterCat==='', 'filter-chip--done': labs.length > 0 && labs.every(l => l.status === 'done') }"
            @click="setFilter(() => filterCat='')">All</button>
          <template x-for="cat in categories" :key="cat">
            <button class="filter-chip"
              :class="{ active: filterCat===cat, 'filter-chip--done': categoryDone(cat) }"
              @click="setFilter(() => filterCat=cat)"
              x-text="cat"></button>
          </template>
        </div>

        <!-- Cards -->
        <div class="cards-grid">
          <template x-for="(lab, idx) in labs" :key="lab.id">
            <article x-data="labCard(lab)" x-init="init()" :class="cardClass()"
              x-show="matchesFilter(lab)"
              x-transition:enter="card-fade-enter"
              x-transition:enter-start="card-fade-enter-from"
              x-transition:enter-end="card-fade-enter-to"
              x-transition:leave="card-fade-leave"
              x-transition:leave-start="card-fade-leave-from"
              x-transition:leave-end="card-fade-leave-to">
              <!-- Col 1: identity -->
              <div class="lab-identity">
                <div class="lab-badge" x-text="String(lab.id.replace('LAB-','')).padStart(2,'0')"></div>
                <div class="lab-content">
                  <div class="lab-name" x-text="lab.name"></div>
                  <div class="lab-meta-row">
                    <span class="lab-category" x-text="lab.category"></span>
                    <span class="meta-sep" x-show="lab.difficulty" aria-hidden="true">·</span>
                    <span class="difficulty-dots" x-show="lab.difficulty"
                      :title="`Difficulty: ${lab.difficulty}/5`">
                      <span class="difficulty-dot" :class="lab.difficulty >= 1 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 2 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 3 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 4 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 5 ? 'difficulty-dot--on' : ''"></span>
                    </span>
                    <span class="meta-sep" x-show="lab.estimated_minutes" aria-hidden="true">·</span>
                    <span class="est-time" x-show="lab.estimated_minutes">
                      <span class="est-time-icon" aria-hidden="true">⏱</span>
                      <span x-text="`~${lab.estimated_minutes}m`"></span>
                    </span>
                  </div>
                </div>
              </div>
              <!-- Col 2: reset (left) + timer (right), reset only when done -->
              <div class="lab-col-timer">
                <button class="btn-card-reset" @click="resetLab()" title="Reset this lab"
                  x-show="lab.status === 'done'">↻</button>
                <div class="lab-timer" x-text="formatTime(elapsed || lab.time_spent || 0)"></div>
              </div>
              <!-- Col 3: secondary actions on the left, primary CTA (Launch)
                   rightmost so the most-used button anchors the card edge.
                   Glyphs are inline SVG (Lucide-style, currentColor-stroked)
                   so they render crisp at any zoom and inherit text colour. -->
              <div class="lab-col-actions">
                <button class="btn-brief"
                  @click="openBrief()"
                  title="Quick reference: summary and key commands">
                  Brief<svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </button>
                <button class="btn-docs"
                  @click="openDocs()"
                  :disabled="!lab.docs_path"
                  :title="lab.docs_path ? 'Open lab documentation' : 'Docs not generated yet — run scripts/split_pdf.py'">
                  Docs<svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </button>
                <span class="action-sep" aria-hidden="true"></span>
                <button class="btn-action"
                  :class="running ? 'btn-action--stop' : lab.status === 'done' ? 'btn-action--done' : 'btn-action--launch'"
                  :disabled="!running && !lab.file_path"
                  :title="running ? 'Stop timer' : lab.file_path ? 'Open in Packet Tracer' : 'Import this lab first'"
                  @click="running ? stopTimer() : launch()"
                  x-text="running ? 'Stop ■' : lab.status === 'done' ? 'Done ✓' : lab.file_path ? 'Launch →' : '— —'">
                </button>
              </div>
            </article>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- IMPORT PAGE -->
  <div class="page" x-show="page==='import'" x-data="importPage()" x-init="loadStatus()">
    <header class="page-header">
      <h1 class="page-title">Import.</h1>
      <p class="page-subtitle">Bring labs into the tracker</p>
    </header>

    <div class="timeline">
      <h2 class="section-head">Method 1 — Upload</h2>
      <div class="section-body">
        <div class="dropzone"
          @dragover.prevent="dragging=true"
          @dragleave.prevent="dragging=false"
          @drop.prevent="handleDrop($event)"
          :class="{dragging}">
          <p class="dropzone-primary">Drag &amp; drop <code>.pka</code> files here</p>
          <p class="dropzone-sep">— or —</p>
          <input type="file" id="fileInput" multiple accept=".pka" @change="handleFileInput($event)">
          <label for="fileInput" class="btn-primary btn-primary--ghost">Browse Files</label>
        </div>
      </div>

      <h2 class="section-head">Method 2 — Scan Folder</h2>
      <div class="section-body">
        <div class="folder-input-row">
          <input type="text" x-model="folderPath" class="folder-input"
                 placeholder="e.g. D:\CCNA Network Labs Professional\Labs">
          <button @click="scanFolder()" :disabled="scanning" class="btn-primary">
            <span x-show="!scanning">Scan</span>
            <span x-show="scanning">Scanning…</span>
          </button>
        </div>
      </div>

      <template x-if="results.length > 0">
        <div>
          <h2 class="section-head" x-text="`Results — ${importedCount} of ${results.length} imported`"></h2>
          <div class="section-body">
            <div class="result-list">
              <template x-for="r in results" :key="r.file">
                <div class="result-row" :class="`result--${r.status}`">
                  <span class="result-glyph" x-text="r.status==='imported'?'✓':r.status==='skipped'?'!':'×'"></span>
                  <span class="result-file" x-text="r.file"></span>
                  <span class="result-detail" x-text="r.lab_id ?? r.reason"></span>
                </div>
              </template>
              <button @click="window.dispatchEvent(new CustomEvent('refresh-labs')); page='dashboard'" class="btn-primary" style="margin-top:16px">
                Go to Dashboard
              </button>
            </div>
          </div>
        </div>
      </template>

      <h2 class="section-head" x-text="`Status — ${status.imported_count} of ${status.total} imported`"></h2>
      <div class="section-body">
        <template x-if="status.missing.length === 0">
          <p class="empty-state">All labs imported. Nothing missing.</p>
        </template>
        <div class="missing-list">
          <template x-for="lab in status.missing" :key="lab.id">
            <div class="missing-row">
              <span class="missing-id" x-text="lab.id"></span>
              <span class="missing-cat" x-text="lab.category"></span>
              <span class="missing-name" x-text="lab.name"></span>
              <span class="status-pill status-pill--missing">
                <span class="status-dot"></span>Missing
              </span>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- ANALYTICS PAGE -->
  <div class="page" x-show="page==='stats'" x-data="statsPage()" x-init="load()">
    <header class="page-header">
      <h1 class="page-title">Analytics.</h1>
      <p class="page-subtitle">A study journal in numbers</p>
    </header>

    <div x-show="loading" class="loading"><span class="spinner"></span> Loading…</div>
    <template x-if="!loading">
      <div class="timeline">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num" x-text="summary.done"></div>
            <div class="stat-rule"></div>
            <div class="stat-label">Done</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" x-text="summary.in_progress"></div>
            <div class="stat-rule"></div>
            <div class="stat-label">In Progress</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" x-text="summary.not_started"></div>
            <div class="stat-rule"></div>
            <div class="stat-label">Not Started</div>
          </div>
          <div class="stat-card">
            <div class="stat-num stat-num--time" x-html="formatTimeRich(summary.total_time_spent)"></div>
            <div class="stat-rule"></div>
            <div class="stat-label">Total Time</div>
          </div>
        </div>

        <h2 class="section-head">Time per Lab — slowest first</h2>
        <div class="section-body">
          <canvas id="timeChart" height="80"></canvas>
        </div>

        <h2 class="section-head">Progress by Category</h2>
        <div class="section-body">
          <div class="category-bars">
            <template x-for="cat in byCategory" :key="cat.category">
              <div class="cat-row">
                <span class="cat-name" x-text="cat.category"></span>
                <div class="cat-track">
                  <div class="cat-fill" :style="`width:${cat.total>0?(cat.done/cat.total)*100:0}%`"></div>
                </div>
                <span class="cat-count" x-text="`${cat.done} / ${cat.total}`"></span>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- QUIZ PAGE (v2) -->
  <div class="page" x-show="page==='quiz'" x-data="quizPage()" x-init="init()">


    <!-- LOADING -->
    <template x-if="view==='loading'">
      <div class="loading"><span class="spinner"></span> Loading…</div>
    </template>

    <!-- LANDING -->
    <template x-if="view==='landing' && dashboard">
      <div class="quiz-landing"
           x-transition:enter="quiz-view-enter"
           x-transition:enter-start="quiz-view-enter-start"
           x-transition:enter-end="quiz-view-enter-end">
        <!-- Big mastery bar (hero style) -->
        <header class="quiz-hero">
          <div class="quiz-hero-left">
            <div class="quiz-hero-stat">
              <span x-text="String(dashboard.mastered_count).padStart(2,'0')"></span><span class="quiz-hero-slash"> / </span><span class="quiz-hero-total" x-text="dashboard.quizable_total"></span>
            </div>
            <div class="quiz-hero-rule"></div>
            <div class="quiz-hero-label">Mastered</div>
          </div>
          <div class="quiz-hero-right">
            <div class="quiz-hero-percent" x-text="`${masteryPct()}% complete`"></div>
            <div class="quiz-hero-sub">
              out of <span x-text="dashboard.parsed_total"></span> parsed
              (<span x-text="dashboard.flagged_count"></span> flagged)
            </div>
          </div>
          <div class="progress-track"><div class="progress-fill" :style="`width:${masteryPct()}%`"></div></div>
        </header>



        <!-- Batch picker -->
        <div class="quiz-batch-grid">
          <template x-for="size in BATCH_SIZES" :key="size.value">
            <button class="quiz-batch-card"
                    :disabled="!canStart(size.value)"
                    @click="startSession(size.value)">
              <div class="quiz-batch-num" x-text="size.label"></div>
              <div class="quiz-batch-sub"
                   x-text="canStart(size.value) ? 'questions' : `only ${candidateCount()} left`"></div>
            </button>
          </template>
        </div>

        <!-- Recent sessions -->
        <hr class="section-divider">
        <div class="quiz-history">
          <template x-if="dashboard.recent_sessions.length === 0">
            <p class="empty-state">No sessions yet.</p>
          </template>
          <template x-for="s in dashboard.recent_sessions" :key="s.id">
            <div class="quiz-history-row">
              <span class="quiz-history-score" x-text="`${s.total_correct}/${s.total_seen}`"></span>
              <span class="quiz-history-pct"   x-text="`(${s.accuracy}%)`"></span>
              <span class="quiz-history-meta"  x-text="`· ${formatDur(s.duration_sec)} · best ${s.best_streak} · ${ago(s.started_at)}`"></span>
            </div>
          </template>
        </div>

        <!-- Reset link -->
        <button class="quiz-reset-link" @click="resetProgress()">↻ Reset all quiz data</button>
      </div>
    </template>

    <!-- PRACTICE -->
    <template x-if="view==='practice' && currentQ" :key="currentQ.question_id">
      <div class="quiz-practice"
           x-transition:enter="quiz-view-enter"
           x-transition:enter-start="quiz-view-enter-start"
           x-transition:enter-end="quiz-view-enter-end">
        <header class="quiz-hero" style="margin-bottom: 24px;">
          <div class="quiz-hero-left">
            <div class="quiz-hero-stat">
              <span x-text="String(currentQ.position.seen + 1).padStart(2,'0')"></span><span class="quiz-hero-slash"> / </span><span class="quiz-hero-total" x-text="currentQ.position.total !== null ? currentQ.position.total : '∞'"></span>
            </div>
            <div class="quiz-hero-rule"></div>
            <div class="quiz-hero-label">Question</div>
          </div>
          <div class="quiz-hero-right">
            <div class="quiz-hero-percent" x-text="`⏱ ${elapsedFormatted}`"></div>
            <button class="quiz-finish-link" @click="finishSession()" style="margin-top: 4px;">Finish session</button>
          </div>
          <div class="progress-track"><div class="progress-fill" :style="`width:${progressPct()}%`"></div></div>
        </header>

        <div class="quiz-question" x-data="{ showTh: false }" x-init="$watch('currentQ', () => showTh = false)">
          <div class="quiz-prompt-row">
            <div class="quiz-prompt-en" x-show="!showTh" x-text="currentQ.prompt_en"></div>
            <div class="quiz-prompt-th" x-cloak x-show="showTh && currentQ.prompt_th" x-text="currentQ.prompt_th"></div>
            <button class="btn-brief quiz-lang-toggle"
                    x-show="currentQ.prompt_th"
                    @click="showTh = !showTh"
                    x-text="showTh ? 'EN' : 'TH'"></button>
          </div>
          <div class="quiz-q-meta">
            <span x-text="`Q #${currentQ.question_id}`"></span>
            <span x-show="currentQ.current_streak > 0"
                  x-text="`· streak ${currentQ.current_streak}`"></span>
            <span class="quiz-q-status" x-show="feedback"
                  :class="feedback && feedback.is_correct ? 'quiz-q-status--correct' : 'quiz-q-status--wrong'"
                  x-text="feedback && feedback.is_correct ? `✓ answered in ${lastQSec}s · streak ${currentQ.current_streak + 1}` : `✗ answered in ${lastQSec}s`"></span>
          </div>

          <template x-if="currentQ.image_urls && currentQ.image_urls.length">
            <div class="quiz-images">
              <template x-for="url in currentQ.image_urls" :key="url">
                <img class="quiz-image" :src="url" alt="" @click="$store.imageModal.show(url)">
              </template>
            </div>
          </template>

          <div class="quiz-choices">
            <template x-for="choice in currentQ.choices" :key="choice.label">
              <button class="quiz-choice"
                      :class="{
                        'quiz-choice--selected': isSelected(choice.label) && !feedback,
                        'quiz-choice--correct':  feedback && isCorrectLabel(choice.label),
                        'quiz-choice--wrong':    feedback && isSelected(choice.label) && !isCorrectLabel(choice.label)
                      }"
                      :disabled="feedback !== null"
                      @click="toggleChoice(choice.label)">
                <span class="quiz-choice-label" x-text="choice.label"></span>
                <span class="quiz-choice-text"
                      :class="{ 'quiz-choice-text--mono': isCiscoText(choice.text) }"
                      x-text="choice.text"></span>
              </button>
            </template>
          </div>

          <!-- Feedback panel only when there's an explanation -->
          <template x-if="feedback && feedback.explanation">
            <div class="quiz-feedback"
                 :class="feedback.is_correct ? 'quiz-feedback--correct' : 'quiz-feedback--wrong'">
              <p class="quiz-feedback-explanation"
                 x-show="feedback.explanation" x-text="feedback.explanation"></p>
            </div>
          </template>

          <div class="quiz-actions">
            <button class="btn-primary btn-primary--ghost" x-show="!feedback"
                    :disabled="submitting"
                    @click="iDontKnow()">I don't know</button>
            <button class="btn-primary" x-show="!feedback"
                    :disabled="selection.length === 0 || submitting"
                    @click="submit()">Submit</button>
            <button class="btn-primary" x-show="feedback" @click="fetchNext()">Next →</button>
          </div>
        </div>
      </div>
    </template>

    <!-- SUMMARY -->
    <template x-if="view==='summary' && finalSummary">
      <div class="quiz-summary"
           x-transition:enter="quiz-view-enter"
           x-transition:enter-start="quiz-view-enter-start"
           x-transition:enter-end="quiz-view-enter-end">
        <header class="quiz-hero" style="margin-bottom: 24px;">
          <div class="quiz-hero-left">
            <div class="quiz-hero-stat">
              <span x-text="finalSummary.total_correct"></span><span class="quiz-hero-slash"> / </span><span class="quiz-hero-total" x-text="finalSummary.total_seen"></span>
            </div>
            <div class="quiz-hero-rule"></div>
            <div class="quiz-hero-label">Score</div>
          </div>
          <div class="quiz-hero-right">
            <div class="quiz-hero-percent" x-text="`${finalSummary.accuracy}% accuracy`"></div>
            <div class="quiz-hero-sub" x-text="`Duration: ${formatDur(finalSummary.duration_sec)}`"></div>
          </div>
          <div class="progress-track"><div class="progress-fill" :style="`width:${finalSummary.accuracy}%`"></div></div>
        </header>

        <template x-if="finalSummary.wrong_answers && finalSummary.wrong_answers.length > 0">
          <div>
            <div class="quiz-wrong-list">
              <template x-for="w in finalSummary.wrong_answers" :key="w.question_id">
                <div class="quiz-wrong-item" x-data="{ open: false, showTh: false }">
                  <!-- div+role="button" because nested <button> would be invalid HTML
                       (browser auto-moves the inner toggle out of the outer button,
                       breaking Alpine's @click scope and the x-transition lifecycle). -->
                  <div class="quiz-wrong-summary"
                       role="button"
                       tabindex="0"
                       :aria-expanded="open"
                       @click="open = !open"
                       @keydown.enter.prevent="open = !open"
                       @keydown.space.prevent="open = !open">
                    <span class="quiz-wrong-prompt"
                          x-text="showTh && w.prompt_th ? w.prompt_th : w.prompt_en"></span>
                    <button type="button"
                            class="btn-brief quiz-lang-toggle"
                            x-show="w.prompt_th"
                            @click.stop="showTh = !showTh"
                            x-text="showTh ? 'EN' : 'TH'"></button>
                    <span class="quiz-wrong-chevron" :class="{ 'is-open': open }">›</span>
                  </div>
                  <!-- grid-rows trick: outer is display:grid with rows transitioning
                       0fr ↔ 1fr; inner clips with overflow:hidden. Avoids Alpine's
                       x-transition machinery which threw uncaught promise rejections
                       on every toggle for our class names. -->
                  <div class="quiz-wrong-body-wrap" :class="{ 'is-open': open }">
                    <div class="quiz-wrong-body">
                      <ul class="quiz-wrong-choices">
                        <template x-for="c in w.choices" :key="c.label">
                          <li :class="{
                                'wrong-choice--correct': w.correct_labels.includes(c.label),
                                'wrong-choice--yours':   w.selected_labels.includes(c.label)
                              }">
                            <strong x-text="c.label"></strong>
                            <span x-text="c.text"></span>
                          </li>
                        </template>
                      </ul>
                      <p class="quiz-feedback-explanation"
                         x-show="w.explanation" x-text="w.explanation"></p>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <div class="quiz-actions">
          <button class="btn-primary btn-primary--ghost" @click="backToLanding()">Back to landing</button>
          <button class="btn-primary" @click="practiceAgain()">Practice again</button>
        </div>
      </div>
    </template>
  </div>

  <!--INCLUDE:modals/modals.html-->

</body>
</html>
