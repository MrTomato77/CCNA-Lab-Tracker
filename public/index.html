<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA Lab Tracker</title>
  <link rel="icon" href="/logo.ico" type="image/x-icon">
  <!-- Pre-paint theme init: avoid flash of wrong theme -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("theme");
        var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (systemDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { /* localStorage may be blocked; default stays */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="core/tokens.css">
  <link rel="stylesheet" href="core/base.css">
  <link rel="stylesheet" href="core/components.css">
  <link rel="stylesheet" href="nav/nav.css">
  <link rel="stylesheet" href="modals/modals.css">
  <link rel="stylesheet" href="practical/practical.css">
  <link rel="stylesheet" href="practical/lab-card.css">
  <link rel="stylesheet" href="import/import.css">
  <link rel="stylesheet" href="analytics/analytics.css">
  <link rel="stylesheet" href="quiz/quiz.css">
  <link rel="stylesheet" href="settings/settings.css">
  <!-- Chart.js MUST load before Alpine (synchronous) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="core/main.js" defer></script>
  <script src="core/app-shell.js" defer></script>
  <script src="practical/lab-card.js" defer></script>
  <script src="import/import.js" defer></script>
  <script src="analytics/analytics.js" defer></script>
  <script src="quiz/quiz.js" defer></script>
  <script src="settings/settings.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
</head>
