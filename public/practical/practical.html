<!-- practical/practical.html — labs page partial (UI label: Practical;
     internal Alpine state stays page==='dashboard'). Stitched into
     index.html by app.py _build_index() via an INCLUDE marker.
     Do NOT add html/body wrappers; do NOT nest INCLUDE markers. -->

  <!-- DASHBOARD -->
  <div class="page" x-show="page==='dashboard'">
    <div x-show="loading" class="loading"><span class="spinner"></span> Loading…</div>
    <template x-if="!loading">
      <div>
        <!-- Hero -->
        <header class="stat-hero">
          <div class="stat-hero-left">
            <div class="stat-hero-figure">
              <span x-text="String(summary.done).padStart(2,'0')"></span><span class="stat-hero-slash"> / </span><span class="stat-hero-total" x-text="summary.total"></span>
            </div>
            <div class="stat-hero-label">Labs completed</div>
          </div>
          <div class="stat-hero-right">
            <div class="stat-hero-headline" x-text="`${summary.completion_percent}% complete`"></div>
            <div class="stat-hero-sub stat-hero-sub--mono" x-text="formatTotalTime(summary.total_time_spent) + ' elapsed'"></div>
          </div>
          <div class="progress-track"><div class="progress-fill" :style="`transform:scaleX(${summary.completion_percent / 100})`"></div></div>
        </header>

        <!-- Filter chips -->
        <div class="filter-strip">
          <div class="status-select" @keydown.escape.prevent="statusOpen = false; $refs.statusTrigger.focus()">
            <button class="status-filter" x-ref="statusTrigger"
              aria-haspopup="menu" :aria-expanded="statusOpen.toString()"
              @click="statusOpen = !statusOpen" @click.outside="statusOpen = false"
              @keydown.arrow-down.prevent="statusOpen = true; $nextTick(() => $refs.statusMenu.querySelector('.status-option')?.focus())">
              <span x-text="{ '': 'All status', done: 'Hide done', undone: 'Hide not done' }[hideStatus]"></span>
              <svg width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="status-dropdown" role="menu" x-ref="statusMenu" x-show="statusOpen" x-cloak
              @keydown.arrow-down.prevent="$event.target.nextElementSibling?.focus()"
              @keydown.arrow-up.prevent="$event.target.previousElementSibling?.focus()">
              <button class="status-option" role="menuitem" :class="{ active: hideStatus === '' }"
                @click="setFilter(() => hideStatus = ''); statusOpen = false; $refs.statusTrigger.focus()">All status</button>
              <button class="status-option" role="menuitem" :class="{ active: hideStatus === 'done' }"
                @click="setFilter(() => hideStatus = 'done'); statusOpen = false; $refs.statusTrigger.focus()">Hide done</button>
              <button class="status-option" role="menuitem" :class="{ active: hideStatus === 'undone' }"
                @click="setFilter(() => hideStatus = 'undone'); statusOpen = false; $refs.statusTrigger.focus()">Hide not done</button>
            </div>
          </div>
          <button class="filter-chip"
            :class="{ active: filterCat==='', 'filter-chip--done': labs.length > 0 && labs.every(l => l.status === 'done') }"
            @click="setFilter(() => filterCat='')">All</button>
          <template x-for="cat in categories" :key="cat">
            <button class="filter-chip"
              :class="{ active: filterCat===cat, 'filter-chip--done': categoryDone(cat) }"
              @click="setFilter(() => filterCat=cat)"
              x-text="cat"></button>
          </template>
        </div>

        <!-- Cards -->
        <div class="cards-grid-stack">
        <template x-for="p in panels" :key="p.id">
          <div class="cards-grid view-panel"
               :class="p.visible ? 'view-active' : 'view-hidden'">
          <template x-for="lab in labs.filter(l => (!p.fc || l.category === p.fc) && (p.hs !== 'done' || l.status !== 'done') && (p.hs !== 'undone' || l.status === 'done'))" :key="lab.id">
            <article x-data="labCard(lab)" x-init="init()" :class="cardClass()">
              <!-- Col 1: identity -->
              <div class="lab-identity">
                <div class="lab-badge" x-text="String(lab.id.replace('LAB-','')).padStart(2,'0')"></div>
                <div class="lab-content">
                  <div class="lab-name" x-text="lab.name"></div>
                  <div class="lab-meta-row">
                    <span class="lab-category" x-text="lab.category"></span>
                    <span class="meta-sep" x-show="lab.difficulty" aria-hidden="true">·</span>
                    <span class="difficulty-dots" x-show="lab.difficulty"
                      :title="`Difficulty: ${lab.difficulty}/5`">
                      <span class="difficulty-dot" :class="lab.difficulty >= 1 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 2 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 3 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 4 ? 'difficulty-dot--on' : ''"></span>
                      <span class="difficulty-dot" :class="lab.difficulty >= 5 ? 'difficulty-dot--on' : ''"></span>
                    </span>
                    <span class="meta-sep" x-show="lab.estimated_minutes" aria-hidden="true">·</span>
                    <span class="est-time" x-show="lab.estimated_minutes">
                      <span class="est-time-icon" aria-hidden="true">⏱</span>
                      <span x-text="`~${lab.estimated_minutes}m`"></span>
                    </span>
                  </div>
                </div>
              </div>
              <!-- Col 2: reset (left) + timer (right), reset only when done -->
              <div class="lab-col-timer">
                <button class="btn-card-reset" @click="resetLab()" title="Reset this lab"
                  x-show="lab.status !== 'not_started' && !running">↻</button>
                <div class="lab-timer" x-text="formatTime(elapsed || lab.time_spent || 0)"></div>
              </div>
              <!-- Col 3: secondary actions on the left, primary CTA (Launch)
                   rightmost so the most-used button anchors the card edge.
                   Glyphs are inline SVG (Lucide-style, currentColor-stroked)
                   so they render crisp at any zoom and inherit text colour. -->
              <div class="lab-col-actions">
                <button class="btn-brief"
                  @click="openBrief()"
                  title="Quick reference: summary and key commands">
                  Brief<svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </button>
                <button class="btn-docs"
                  @click="openDocs()"
                  :disabled="!lab.docs_path"
                  :title="lab.docs_path ? 'Open lab documentation' : 'Docs not generated yet — run scripts/split_pdf.py'">
                  Docs<svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </button>
                <span class="action-sep" aria-hidden="true"></span>
                <button class="btn-action"
                  :class="running ? 'btn-action--stop' : lab.status === 'done' ? 'btn-action--done' : 'btn-action--launch'"
                  :disabled="!running && !lab.file_path"
                  :title="running ? 'Stop timer' : lab.file_path ? 'Open in Packet Tracer' : 'Import this lab first'"
                  @click="running ? stopTimer() : launch()"
                  x-text="running ? 'Stop ■' : lab.status === 'done' ? 'Done ✓' : lab.file_path ? 'Launch →' : 'Not imported'">
                </button>
              </div>
            </article>
          </template>
          </div>
        </template>
        </div>

        <!-- Empty state: filter excludes every lab -->
        <p class="empty-state" style="text-align:center; padding:48px 0;"
           x-show="labs.filter(l => matchesFilter(l)).length === 0">
          No labs match this filter.
          <button class="quiz-finish-link" @click="setFilter(() => { filterCat=''; hideStatus=''; })">Clear filters</button>
        </p>
      </div>
    </template>
  </div>
