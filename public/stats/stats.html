<!-- analytics/analytics.html — analytics page partial (UI label: Analytics;
     internal Alpine state stays page==='stats'). Stitched into index.html
     by app.py _build_index() via an INCLUDE marker. Do NOT add html/body
     wrappers; do NOT nest INCLUDE markers (single-pass expansion only). -->
  <div class="page" x-show="page==='stats'" x-data="statsPage()" x-init="load()">
    <header class="page-header">
      <div>
        <h1 class="page-title">Analytics.</h1>
        <p class="page-subtitle">A study journal in numbers</p>
      </div>
      <div class="analytics-toggle">
        <button class="analytics-toggle-btn" :class="{active: analyticsView==='practical'}" @click="analyticsView='practical'">Practical</button>
        <button class="analytics-toggle-btn" :class="{active: analyticsView==='quiz'}" @click="analyticsView='quiz'">Quiz</button>
      </div>
    </header>

    <div x-show="loading" class="loading"><span class="spinner"></span> Loading…</div>
    <div x-show="!loading" class="timeline">
      <!-- Practical Section -->
      <div class="view-panel" :class="analyticsView==='practical' ? 'view-active' : 'view-hidden'">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num" x-text="summary.done"></div>
            <div class="stat-label">Done</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" x-text="summary.in_progress"></div>
            <div class="stat-label">In Progress</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" x-text="summary.not_started"></div>
            <div class="stat-label">Not Started</div>
          </div>
          <div class="stat-card">
            <div class="stat-num stat-num--time" x-html="formatTimeRich(summary.total_time_spent)"></div>
            <div class="stat-label">Total Time</div>
          </div>
        </div>

        <h3 class="section-head">Time per Lab — slowest first</h3>
        <div class="section-body">
          <canvas id="timeChart" height="80"></canvas>
        </div>

        <h3 class="section-head">Progress by Category</h3>
        <div class="section-body">
          <div class="category-bars">
            <template x-for="cat in byCategory" :key="cat.category">
              <div class="cat-row">
                <span class="cat-name" x-text="cat.category"></span>
                <div class="cat-track">
                  <div class="cat-fill" :style="`transform:scaleX(${cat.total>0?(cat.done/cat.total):0})`"></div>
                </div>
                <span class="cat-count" x-text="`${cat.done} / ${cat.total}`"></span>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Quiz Section -->
      <div class="view-panel" :class="analyticsView==='quiz' ? 'view-active' : 'view-hidden'">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num" x-text="quizSummary.mastered_count"></div>
            <div class="stat-label">Mastered</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" x-text="quizSummary.quizable_total"></div>
            <div class="stat-label">In Pool</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" x-text="quizSummary.avg_accuracy"></div>
            <div class="stat-label">Avg Accuracy</div>
          </div>
          <div class="stat-card">
            <div class="stat-num" x-text="quizSummary.total_sessions"></div>
            <div class="stat-label">Sessions</div>
          </div>
        </div>

        <h3 class="section-head">Accuracy Trend (last 10 sessions)</h3>
        <div class="section-body">
          <template x-if="quizLoaded">
            <canvas id="accuracyChart" height="80"></canvas>
          </template>
          <template x-if="!quizLoaded">
            <p class="empty-state">Quiz data not available.</p>
          </template>
        </div>
      </div>
    </div>
  </div>
